<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920"
     font-family="'PingFang TC','Noto Sans TC','Helvetica Neue',sans-serif">
  <title>ARK 方舟運算 App v1.7.4 UX 功能地圖</title>
  <desc>由 ark-explore 對 v1.7.4 實際 AX 探索產出（2026-08-06，32 頁）。
        上半為核心資料流，下半為六個底部 tab 的完整功能地圖。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F4A340"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5C7086"/>
    </marker>
    <linearGradient id="flowBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16212F"/>
      <stop offset="100%" stop-color="#131C28"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="920" fill="#0F1722"/>

  <!-- ══════════════════ 標題 ══════════════════ -->
  <text x="50" y="42" font-size="27" font-weight="600" fill="#E8EEF4" letter-spacing="1">
    方舟運算 ARK <tspan fill="#5C7086" font-weight="400">— UX 功能地圖</tspan>
  </text>
  <text x="50" y="65" font-size="12.5" fill="#8FA3B8">
    v1.7.4　由 ark-explore 實際 AX 探索產出（2026-08-06，32 頁）
    <tspan fill="#5C7086">每個節點標示：功能 → 內容 → 作用</tspan>
  </text>

  <!-- 圖例 -->
  <g font-size="11" fill="#8FA3B8">
    <rect x="1010" y="30" width="11" height="11" rx="2.5" fill="#F4A340"/><text x="1028" y="40">決策計算</text>
    <rect x="1105" y="30" width="11" height="11" rx="2.5" fill="#3FB8AF"/><text x="1123" y="40">部位資料</text>
    <rect x="1200" y="30" width="11" height="11" rx="2.5" fill="#A78BFA"/><text x="1218" y="40">內容學習</text>
    <rect x="1295" y="30" width="11" height="11" rx="2.5" fill="#F472B6"/><text x="1313" y="40">社群</text>
    <rect x="1370" y="30" width="11" height="11" rx="2.5" fill="#94A3B8"/><text x="1388" y="40">帳務</text>
  </g>

  <!-- ══════════════════ 核心資料流 ══════════════════ -->
  <rect x="36" y="88" width="1368" height="232" rx="12" fill="url(#flowBand)" stroke="#22303F"/>
  <text x="54" y="112" font-size="14" font-weight="600" fill="#F4A340" letter-spacing="2">核心資料流</text>
  <text x="152" y="112" font-size="11.5" fill="#8FA3B8">
    所有建議都站在手動維護的庫存上 —— 庫存過期，整條鏈的輸出全部是錯的
  </text>

  <!-- 流程節點 -->
  <g>
    <!-- 1 Shioaji -->
    <rect x="54" y="130" width="212" height="112" rx="9" fill="#141F2B" stroke="#2E4152" stroke-dasharray="4 3"/>
    <text x="70" y="153" font-size="13" font-weight="600" fill="#8FA3B8">永豐 Shioaji</text>
    <text x="70" y="174" font-size="10.5" fill="#6E8399">App 外部・真實持倉</text>
    <text x="70" y="192" font-size="10.5" fill="#6E8399">代號・股數・成交均價</text>
    <text x="70" y="218" font-size="10.5" fill="#3FB8AF">作用：唯一真實來源</text>

    <!-- 2 調節庫存 -->
    <rect x="329" y="130" width="212" height="112" rx="9" fill="#12262A" stroke="#3FB8AF"/>
    <text x="345" y="153" font-size="13" font-weight="600" fill="#3FB8AF">自選 › 調節庫存</text>
    <text x="345" y="174" font-size="10.5" fill="#A9C4CE">手動維護的庫存清單</text>
    <text x="345" y="192" font-size="10.5" fill="#A9C4CE">股數・成本均價・位階</text>
    <text x="345" y="218" font-size="10.5" fill="#3FB8AF">作用：整個 App 的輸入源</text>

    <!-- 3 風控運算 -->
    <rect x="604" y="130" width="212" height="112" rx="9" fill="#2A2113" stroke="#F4A340"/>
    <text x="620" y="153" font-size="13" font-weight="600" fill="#F4A340">運算 › 風控運算</text>
    <text x="620" y="174" font-size="10.5" fill="#D9C4A5">帶入庫存 + 手填 TWD/USD</text>
    <text x="620" y="192" font-size="10.5" fill="#D9C4A5">五指標 → 資金總額</text>
    <text x="620" y="218" font-size="10.5" fill="#F4A340">作用：決定整體曝險</text>

    <!-- 4 建議比例 -->
    <rect x="879" y="130" width="212" height="112" rx="9" fill="#2A2113" stroke="#F4A340"/>
    <text x="895" y="153" font-size="13" font-weight="600" fill="#F4A340">持股配置建議 X%</text>
    <text x="895" y="174" font-size="10.5" fill="#D9C4A5">建議持股金額</text>
    <text x="895" y="192" font-size="10.5" fill="#D9C4A5">建議閒錢・參考調節金額</text>
    <text x="895" y="218" font-size="10.5" fill="#F4A340">作用：總量的答案</text>

    <!-- 5 每檔建議 -->
    <rect x="1154" y="130" width="212" height="112" rx="9" fill="#12262A" stroke="#3FB8AF"/>
    <text x="1170" y="153" font-size="13" font-weight="600" fill="#3FB8AF">每檔的建議</text>
    <text x="1170" y="174" font-size="10.5" fill="#A9C4CE">調節庫存：建議調節股數</text>
    <text x="1170" y="192" font-size="10.5" fill="#A9C4CE">布局自選：位階／風控股數</text>
    <text x="1170" y="218" font-size="10.5" fill="#3FB8AF">作用：個股的答案</text>
  </g>

  <!-- 流程箭頭 -->
  <g stroke="#F4A340" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M266,186 L325,186"/>
    <path d="M541,186 L600,186"/>
    <path d="M816,186 L875,186"/>
    <path d="M1091,186 L1150,186"/>
  </g>
  <g font-size="9.5" fill="#F4A340" text-anchor="middle">
    <text x="295" y="178">ark-sync</text>
    <text x="570" y="178">帶入庫存</text>
    <text x="845" y="178">五指標</text>
    <text x="1120" y="178">分配</text>
  </g>

  <text x="54" y="266" font-size="11" fill="#8FA3B8">
    ARK 沒有券商連線。庫存必須手動維護，這就是 ark-sync 存在的唯一理由，
    也是 ark-analyze 預設先與 Shioaji 對帳的理由。
  </text>
  <text x="54" y="286" font-size="11" fill="#8FA3B8">
    擇時（該有幾成持股）與選股（哪些標的在價值區）是兩條獨立的線，
    在「調節庫存」這一頁才交會成每檔的具體股數。
  </text>
  <text x="54" y="306" font-size="11" fill="#5C7086">
    五指標＝全球散戶・外資情緒・位階增溫・社交反指・量能爆衝（算法不可見，只看得到結果）
  </text>

  <!-- ══════════════════ 完整功能地圖 ══════════════════ -->
  <text x="54" y="358" font-size="14" font-weight="600" fill="#E8EEF4" letter-spacing="2">完整功能地圖</text>
  <text x="176" y="358" font-size="11.5" fill="#8FA3B8">底部 tab 六個，由左至右固定</text>

